blueprint:
  name: HVAC Comfort Start — Resume/Verify at Comfort Time (v4, RC1 w/ indoor temp
    selector)
  description: At comfort time, finalize an active HCS cycle. HCS operates only while the thermostat remains in Heat mode and never changes HVAC operating mode.
  domain: automation
  input:
    climate:
      name: Climate entity
      selector:
        entity:
          domain:
          - climate
          multiple: false
          reorder: false
    indoor_temp:
      name: Indoor temperature sensor
      description: Authoritative indoor temperature sensor used for verification/arrival
        logic.
      selector:
        entity:
          domain:
          - sensor
          device_class:
          - temperature
          multiple: false
          reorder: false
    comfort_time:
      name: Comfort Time helper
      description: input_datetime that represents the daily comfort time.
      selector:
        entity:
          domain:
          - input_datetime
          multiple: false
          reorder: false
    target_temp_helper:
      name: Target temperature helper
      description: Single source of truth for the comfort target temperature.
      selector:
        entity:
          domain:
          - input_number
          multiple: false
          reorder: false
    preheat_active:
      name: Preheat Active helper
      selector:
        entity:
          domain:
          - input_boolean
          multiple: false
          reorder: false
    tolerance:
      name: Temperature tolerance
      description: Consider target met when indoor temperature is within this tolerance.
      default: 0.3
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          mode: box
          unit_of_measurement: °
    enforce_heat_if_below:
      name: Continue heating if below target
      description: If enabled and the thermostat remains in Heat mode, keep the comfort target applied until met or timeout.
      default: true
      selector:
        boolean: {}
    enforce_timeout_minutes:
      name: Enforce timeout (minutes)
      description: Max time to enforce heat while waiting to reach the target.
      default: 90
      selector:
        number:
          min: 5.0
          max: 240.0
          step: 5.0
          mode: box
          unit_of_measurement: min
    resume_hvac_mode:
      name: Legacy resume HVAC mode (ignored)
      description: Retained for backward compatibility with existing blueprint instances. HCS no longer changes HVAC operating mode.
      default: auto
      selector:
        select:
          options:
          - auto
          - heat
          - cool
          - 'off'
          multiple: false
          custom_value: false
          sort: false
    resume_preset_mode:
      name: Resume preset mode (optional)
      description: 'If your thermostat supports presets (eg ''schedule'', ''home'',
        ''none''), set it here. Leave blank to skip preset changes.

        '
      default: ''
      selector:
        text:
          multiline: false
          multiple: false
    debug_log:
      name: Debug logging
      description: Writes key decisions to the logbook.
      default: false
      selector:
        boolean: {}
mode: single
variables:
  climate_entity: !input climate
  indoor_temp_entity: !input indoor_temp
  comfort_time_entity: !input comfort_time
  target_temp_entity: !input target_temp_helper
  preheat_active_entity: !input preheat_active
  tolerance: !input tolerance
  enforce_heat_if_below: !input enforce_heat_if_below
  enforce_timeout_minutes: !input enforce_timeout_minutes
  resume_hvac_mode: !input resume_hvac_mode
  resume_preset_mode: !input resume_preset_mode
  debug_log: !input debug_log
  indoor_temp: '{{ states(indoor_temp_entity) | float(none) }}'
  target_temp: '{{ states(target_temp_entity) | float(none) }}'
  current_hvac_mode: '{{ states(climate_entity) }}'
  thermostat_is_off: '{{ states(climate_entity) == ''off'' }}'
  tolerance_native: '{% set u = state_attr(indoor_temp_entity, ''unit_of_measurement'')
    | string | upper %} {% set tf = tolerance | float(0.3) %} {{ (tf * 5 / 9) if u
    in [''°C'', ''C'', ''CELSIUS''] else tf }}'
  target_met: "{% set t_in = states(indoor_temp_entity) | float(none) %} {% set t_tgt
    = states(target_temp_entity) | float(none) %} {% if t_in is none or t_tgt is none
    %}\n  false\n{% else %}\n  {{ t_in >= (t_tgt - (tolerance_native | float(0)))
    }}\n{% endif %}"
trigger:
- platform: time
  at: !input comfort_time
condition:
- condition: state
  entity_id: !input preheat_active
  state: 'on'
action:
- if:
  - condition: template
    value_template: '{{ debug_log }}'
  then:
  - service: logbook.log
    data:
      name: Comfort Start
      message: Comfort time reached. Indoor={{ states(indoor_temp_entity) }}, Target={{ states(target_temp_entity) }}, Met={{ target_met }}, Enforce={{ enforce_heat_if_below }}.
      entity_id: '{{ climate_entity }}'
- if:
  - condition: not
    conditions:
    - condition: state
      entity_id: !input climate
      state: heat
  then:
  - service: input_boolean.turn_off
    target:
      entity_id: !input preheat_active
  - stop: Thermostat is not in Heat mode; HCS relinquished control.
- condition: template
  value_template: "{{ (states(indoor_temp_entity) | float(none)) is not none and (states(target_temp_entity) | float(none)) is not none }}"
- if:
  - condition: template
    value_template: '{{ target_met }}'
  then:
  - if:
    - condition: template
      value_template: '{{ debug_log }}'
    then:
    - service: logbook.log
      data:
        name: Comfort Start
        message: Target already met. HCS finalizing without changing HVAC mode.
        entity_id: '{{ climate_entity }}'
  else:
  - if:
    - condition: template
      value_template: '{{ enforce_heat_if_below }}'
    then:
    - service: climate.set_temperature
      target:
        entity_id: !input climate
      data:
        temperature: '{{ states(target_temp_entity) | float }}'
    - wait_template: >-
        {% set t_in = states(indoor_temp_entity) | float(none) %}
        {% set t_tgt = states(target_temp_entity) | float(none) %}
        {{ states(climate_entity) != 'heat'
           or (t_in is not none and t_tgt is not none
               and t_in >= (t_tgt - (tolerance_native | float(0)))) }}
      timeout:
        minutes: !input enforce_timeout_minutes
      continue_on_timeout: true
    - if:
      - condition: not
        conditions:
        - condition: state
          entity_id: !input climate
          state: heat
      then:
      - service: input_boolean.turn_off
        target:
          entity_id: !input preheat_active
      - stop: HVAC mode changed; HCS relinquished control.
- service: pyscript.furnace_preheat_evaluate_arrival
  data: {}
- if:
  - condition: template
    value_template: '{{ resume_preset_mode | length > 0 }}'
  then:
  - service: climate.set_preset_mode
    target:
      entity_id: !input climate
    data:
      preset_mode: '{{ resume_preset_mode }}'
- service: input_boolean.turn_off
  target:
    entity_id: !input preheat_active
